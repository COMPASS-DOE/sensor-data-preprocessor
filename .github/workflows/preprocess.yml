on:

  workflow_dispatch:
  schedule:
    - cron: "54 * * * *"
      timezone: "America/New_York"

name: Preprocess data

jobs:
  timed_action:
    name: Preprocess COMPASS sensor data
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    container:
      image: rocker/tidyverse:4.6.1
    permissions:
      contents: write

    steps:
      - run: git config --system --add safe.directory '*'

      - name: Hello
        run: echo "Hello world!"

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Load Dropbox token
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.DROPBOX }}
          filename: "tokenfile.RDS"

      - name: Install remotes and arrow
        run: Rscript -e "install.packages(c('remotes', 'arrow'))"
        
      - name: Install rdrop2 and compasstools
        run: Rscript -e "remotes::install_github(c('COMPASS-DOE/rdrop2refreshtoken', 'COMPASS-DOE/compasstools'))"

      - name: Run preprocessor
        run: Rscript --verbose preprocessor.R

      - name: Commit and push
        run: |
          git config --global user.name 'stephpenn1'
          git config --global user.email 'stephanie.pennington@pnnl.gov'
          git add .
          git commit -m "Automated update" || echo "No changes to commit"
          git push
